server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index manual/pages/main.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    location /manual/ {
        # Images and assets never change: cache them
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri $uri/ =404;
    }

    # Friendly root redirect to the manual
    location = / {
        return 302 /manual/pages/main.html;
    }
}
